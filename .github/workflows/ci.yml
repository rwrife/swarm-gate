name: Native iPhone CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux-packages:
    runs-on: ubuntu-latest
    container:
      image: swift:6.2-noble
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install SQLite headers
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev python3
      - name: Parse app sources syntax on Linux
        run: sh scripts/parse_sources.sh
      - name: Enforce project contract intent and mutation tests
        run: |
          python3 scripts/check_contract.py
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Test pure engine package
        run: swift test --package-path Packages/SwarmGateKit
      - name: Test GRDB store package
        run: swift test --package-path Packages/SwarmGateStore
  ios-build:
    runs-on: macos-26
    timeout-minutes: 45 # Leave artifact upload time after bounded sim/test step.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Enforce project contract and mutation tests
        run: |
          python3 scripts/check_contract.py
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Select exact Xcode and build iPhone app
        shell: bash
        run: |
          set -euo pipefail
          pick=''
          for candidate in /Applications/Xcode*.app/Contents/Developer; do
            [[ -d "$candidate" ]] || continue
            version=$(DEVELOPER_DIR="$candidate" xcodebuild -version)
            if [[ "$version" == $'Xcode 26.0.1\nBuild version 17A400' ]]; then
              pick="$candidate"
              break
            fi
          done
          [[ -n "$pick" ]] || { echo 'Exact Xcode 26.0.1 (17A400) unavailable'; exit 1; }
          export DEVELOPER_DIR="$pick"
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          [[ "$sdk" == 26.0 ]] || { echo "Expected iPhoneOS SDK 26.0; got $sdk"; exit 1; }
          # Hosted images may include the pinned Xcode but omit its matching
          # platform download. Do not silently switch to a newer Xcode.
          if ! xcodebuild -project SwarmGate.xcodeproj -scheme SwarmGate \
            -showdestinations 2>&1 | tee "$RUNNER_TEMP/destinations.txt"; then
            echo 'Could not inspect build destinations'; exit 1
          fi
          if ! grep -Fq 'Any iOS Simulator Device' "$RUNNER_TEMP/destinations.txt"; then
            echo 'Pinned iOS 26 platform unavailable; downloading for exact Xcode'
            xcodebuild -downloadPlatform iOS -architectureVariant universal
          fi
          xcodebuild build -project SwarmGate.xcodeproj -scheme SwarmGate \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SwarmGateDerivedData" CODE_SIGNING_ALLOWED=NO
          sim_app="$RUNNER_TEMP/SwarmGateDerivedData/Build/Products/Debug-iphonesimulator/SwarmGate.app"
          info="$sim_app/Info.plist"
          [[ -f "$info" ]] || { echo 'Built app Info.plist missing'; exit 1; }
          python3 - "$info" <<'PY'
          import plistlib
          import sys
          with open(sys.argv[1], 'rb') as f:
              info = plistlib.load(f)
          assert info.get('UIDeviceFamily') == [1], info.get('UIDeviceFamily')
          assert info.get('CFBundleIdentifier') == 'com.infinityball.swarmgate', info.get('CFBundleIdentifier')
          print('Built app UIDeviceFamily=[1], CFBundleIdentifier=com.infinityball.swarmgate')
          PY
          xcodebuild archive -project SwarmGate.xcodeproj -scheme SwarmGate \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -archivePath "$RUNNER_TEMP/SwarmGateIcon.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/SwarmGateIconDerivedData" CODE_SIGNING_ALLOWED=NO
          app="$RUNNER_TEMP/SwarmGateIcon.xcarchive/Products/Applications/SwarmGate.app"
          [[ -s "$app/Assets.car" ]] || { echo 'Compiled Assets.car missing from archive'; exit 1; }
          python3 - "$app/Info.plist" <<'PY'
          import plistlib
          import sys
          with open(sys.argv[1], 'rb') as f:
              info = plistlib.load(f)
          assert info.get('UIDeviceFamily') == [1], info.get('UIDeviceFamily')
          assert info.get('CFBundleIdentifier') == 'com.infinityball.swarmgate', info.get('CFBundleIdentifier')
          print('Archived app UIDeviceFamily=[1], CFBundleIdentifier=com.infinityball.swarmgate')
          PY
          # Xcode 26 single-size icons keep artwork inside Assets.car and may
          # surface rasters only in actool intermediates; either proof works.
          if ! compgen -G "$app/AppIcon*.png" >/dev/null; then
            rasters=$(find "$RUNNER_TEMP/SwarmGateIconDerivedData" -name 'AppIcon*' -type f 2>/dev/null | head -5)
            [[ -n "$rasters" ]] || { echo 'No compiled AppIcon raster in archive or actool intermediates'; exit 1; }
            printf 'Compiled AppIcon rasters:\n%s\n' "$rasters"
          fi
          echo "Archived app contains compiled Assets.car and AppIcon artwork"
      - name: Simulator menu to run to summary journey
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          pick=''
          for candidate in /Applications/Xcode*.app/Contents/Developer; do
            [[ -d "$candidate" ]] || continue
            version=$(DEVELOPER_DIR="$candidate" xcodebuild -version)
            if [[ "$version" == $'Xcode 26.0.1\nBuild version 17A400' ]]; then
              pick="$candidate"
              break
            fi
          done
          [[ -n "$pick" ]] || { echo 'Exact Xcode 26.0.1 (17A400) unavailable'; exit 1; }
          export DEVELOPER_DIR="$pick"
          python3 scripts/run_simulator.py
      - name: Preserve simulator result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swarm-gate-simulator-result
          path: ${{ runner.temp }}/SwarmGateUI.xcresult
          if-no-files-found: ignore
          retention-days: 7
